<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#f9fafb"/>

  <!-- Floating notes -->
  <!-- Note 1 -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="120" height="140" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="10" y="10" width="100" height="8" rx="4" fill="#667eea" opacity="0.3"/>
    <rect x="10" y="30" width="80" height="6" rx="3" fill="#d1d5db"/>
    <rect x="10" y="45" width="90" height="6" rx="3" fill="#d1d5db"/>
    <rect x="10" y="60" width="70" height="6" rx="3" fill="#d1d5db"/>
    <circle cx="100" cy="130" r="8" fill="#10b981"/>
  </g>

  <!-- Note 2 -->
  <g transform="translate(200, 80)">
    <rect x="0" y="0" width="140" height="160" rx="8" fill="white" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="10" y="10" width="120" height="8" rx="4" fill="#764ba2" opacity="0.3"/>
    <rect x="10" y="30" width="100" height="6" rx="3" fill="#d1d5db"/>
    <rect x="10" y="45" width="110" height="6" rx="3" fill="#d1d5db"/>
    <rect x="10" y="60" width="90" height="6" rx="3" fill="#d1d5db"/>
    <rect x="10" y="75" width="105" height="6" rx="3" fill="#d1d5db"/>
    <circle cx="120" cy="145" r="8" fill="#f59e0b"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="30" cy="250" r="15" fill="#667eea" opacity="0.2"/>
  <circle cx="370" cy="40" r="20" fill="#764ba2" opacity="0.15"/>
  <circle cx="180" cy="280" r="10" fill="#10b981" opacity="0.2"/>
</svg>
