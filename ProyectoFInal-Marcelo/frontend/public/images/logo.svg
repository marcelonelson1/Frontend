<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#gradient)"/>

  <!-- Note icon -->
  <g transform="translate(50, 40)">
    <!-- Paper -->
    <rect x="10" y="10" width="80" height="100" rx="5" fill="white" opacity="0.95"/>

    <!-- Lines -->
    <line x1="20" y1="30" x2="80" y2="30" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="50" x2="80" y2="50" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="70" x2="65" y2="70" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="90" x2="75" y2="90" stroke="#667eea" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
